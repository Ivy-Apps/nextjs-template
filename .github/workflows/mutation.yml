name: Mutation

# Stryker's mutation score of the `.ts` logic. Advisory, outside `just check`
# and never a required check: thresholds.break is null, so a low score passes,
# and on a pull request a Stryker crash does not fail the job either. A crash
# on the schedule or a manual run does, because nobody reads those otherwise.
#
# A pull request runs only the mutants whose code or tests changed since the
# incremental file it restores. The schedule and manual runs test every mutant,
# because the incremental file cannot see a dependency bump or a change to a
# fake in `test/`, and on `main` they save the file pull requests start from.

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Cache entries are immutable, so each run saves its own key and restores
      # the newest one its ref can read: its own, then `main`'s. A pull
      # request's entries are scoped to that pull request, so a fork can never
      # write what `main` or another pull request restores.
      - name: Restore the incremental file
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryker-incremental-

      - name: Run Stryker
        id: stryker
        # Bash here for its pipefail: without it `tee` hides a crash.
        shell: bash
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # Under the job's, so the steps below still report a hung run.
        timeout-minutes: 25
        env:
          MODE: ${{ github.event_name == 'pull_request' && '--incremental' || '--force' }}
        run: nix develop -c just mutation --allowConsoleColors false "$MODE" | tee "$RUNNER_TEMP/stryker.log"

      - name: Save the incremental file
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report the score
        if: always()
        env:
          OUTCOME: ${{ steps.stryker.outcome }}
        run: |
          {
            echo '## Mutation score (advisory)'
            if [ "$OUTCOME" = success ]; then
              echo '```text'
              grep -E '(\|.*){7}' "$RUNNER_TEMP/stryker.log"
              echo '```'
            else
              echo "Stryker did not finish ($OUTCOME): see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
          if-no-files-found: ignore
